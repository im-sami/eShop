
name: SonarQube Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install analysis tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"

      - name: Build
        run: dotnet build eShop.Web.slnf --no-incremental

      - name: Run tests and collect coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set +e
          dotnet-coverage collect \
            "dotnet test --solution eShop.Web.slnf --no-build" \
            -f xml -o coverage.xml
          test_status=$?

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
          scan_status=$?

          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi
          exit "$test_status"

      - name: Generate SonarQube Markdown report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        shell: bash
        run: |
          mkdir -p report

          if [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "Missing SonarQube project key or token." > report/sonarqube-report.md
            exit 0
          fi

          
          HTTP_CODE=$(curl -sS -G \
            -u "$SONAR_TOKEN:" \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "metricKeys=complexity,cognitive_complexity,duplicated_lines_density,line_coverage,branch_coverage,bugs,vulnerabilities,code_smells,software_quality_maintainability_rating,sqale_index" \
            -o report/api-response.json \
            -w "%{http_code}" \
            "https://sonarcloud.io/api/measures/component") || {
              echo "curl failed to contact SonarQube Cloud."
              exit 1
            }

          echo "SonarQube API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API response body:"
            cat report/api-response.json
            exit 1
          fi

          RESPONSE=$(cat report/api-response.json)

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eShop-sonarqube-report
          path: report/sonarqube-report.md
          if-no-files-found: warn
