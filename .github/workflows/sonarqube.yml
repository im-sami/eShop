
name: SonarQube Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install analysis tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"

      - name: Build
        run: dotnet build eShop.Web.slnf --no-incremental

      - name: Run tests and collect coverage
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set +e

          dotnet-coverage collect \
            "dotnet test --solution eShop.Web.slnf --no-build" \
            -f xml -o coverage.xml
          test_status=$?

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
          scan_status=$?

          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi

          exit "$test_status"

      - name: Generate SonarQube Markdown report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        shell: bash
        run: |
          mkdir -p report
          REPORT="report/sonarqube-report.md"

          {
            echo "# eShop SonarQube Metrics Report"
            echo
            echo "- **Project key:** ${SONAR_PROJECT_KEY:-Not configured}"
            echo "- **Generated:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
          } > "$REPORT"

          if [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "SonarQube project key or token is missing." >> "$REPORT"
            exit 0
          fi

          HTTP_CODE=$(curl -sS -G \
            -u "$SONAR_TOKEN:" \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "metricKeys=complexity,cognitive_complexity,duplicated_lines_density,line_coverage,branch_coverage,bugs,vulnerabilities,code_smells,sqale_index" \
            -o report/api-response.json \
            -w "%{http_code}" \
            "https://sonarcloud.io/api/measures/component") || {
              echo "Could not connect to SonarQube Cloud." >> "$REPORT"
              exit 0
            }

          echo "SonarQube API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            {
              echo "## API Error"
              echo
              echo "HTTP status: $HTTP_CODE"
              echo
              echo '```json'
              cat report/api-response.json
              echo
              echo '```'
            } >> "$REPORT"
            exit 0
          fi

          jq -r '
            (.component.measures // []
              | map({(.metric): .value}) | add // {}) as $m |
            "## Metrics",
            "",
            "| Metric | Value |",
            "|---|---:|",
            "| Cyclomatic complexity | \($m.complexity // "N/A") |",
            "| Cognitive complexity | \($m.cognitive_complexity // "N/A") |",
            "| Code duplication (%) | \($m.duplicated_lines_density // "N/A") |",
            "| Line coverage (%) | \($m.line_coverage // "N/A") |",
            "| Branch coverage (%) | \($m.branch_coverage // "N/A") |",
            "| Bugs | \($m.bugs // "N/A") |",
            "| Vulnerabilities | \($m.vulnerabilities // "N/A") |",
            "| Code smells | \($m.code_smells // "N/A") |",
            "| Technical debt (minutes) | \($m.sqale_index // "N/A") |",
            "",
            "## Notes",
            "",
            "- Line coverage is used as a proxy for statement coverage; the two definitions may differ.",
            "- Technical debt is not the traditional Maintainability Index (MI).",
            "- N/A means the metric was not returned by SonarQube."
          ' report/api-response.json >> "$REPORT"

          echo "Markdown report generated at $REPORT"
          cat "$REPORT"

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eShop-sonarqube-report
          path: report/sonarqube-report.md
          if-no-files-found: warn
